<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mein Traumurlaub</title>
</head>
<body style="background-color: lightpink;">
  <h1>5R - Aleksandr Chernobai</h1>
  <h2>Mein Traumurlaub</h2>
  <p>
    Mein Urlaubsland: Griechenland<br>
    Hauptstadt: Athen
  </p>
  <h2>Top 3 Sehenswürdigkeiten</h2>
  <ol>
    <li>Akropolis (Athen)</li>
    <li>Santorin – Vulkankrater und Caldera</li>
    <li>Meteora – Klöster auf Felsen</li>
  </ol>
  <h2>Kulinarische Spezialitäten</h2>
  <ul id="liste-essen"></ul>
  <h2>Visueller Eindruck</h2>
  <figure>
    <img
      src="img/wahrzeichen.jpg"
      width="300"
      height="auto"
      title="Vorgegebenes Bild"
      alt="Außenansicht des Khevenhüller Gymnasiums in Linz – ein historisches Schulgebäude mit klassischer Fassade."
    >
    <figcaption>
      Foto von <a href="https://de.wikipedia.org/wiki/Benutzer:Dieter_Vormayr">Dieter Vormayr</a> –
      <a href="https://commons.wikimedia.org/wiki/File:Khevenh%C3%BCller_Gymnasium.JPG">Khevenhüller Gymnasium</a> –
      Lizenz: <a href="https://creativecommons.org/licenses/by-sa/3.0/de/">CC BY-SA 3.0 DE</a>
    </figcaption>
  </figure>
  <script>
    const essen = ["Moussaka", "Souvlaki", "Spanakopita", "Athen"];
    const liste = document.getElementById("liste-essen");
    essen.forEach(h => {
      let li = document.createElement("li");
      li.textContent = h;
      liste.appendChild(li);
    });
  </script>
</body>
</html>
